<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 1</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Hola desde Bootstrap</h1>
<!---Bootstrap Navr-->

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">LDSM406</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
            <a class="nav-link" href="#">Inicio</a>
            <a class="nav-link" href="#">Somos</a>
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </div>
        </div>
    </div>
    </nav>


    <!---Galeria usando un bonito Carrusel-->
        <div id="carouselExampleCaptions" class="carousel slide">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
        <div class="carousel-item active" style="max-height: 600px;">
        <img src="../imagenes/fisica.jpeg" class="d-block w-100" alt="imagen de fisica">
        <div class="carousel-caption d-none d-md-block">
            <h5>Fisica</h5>
            <p>Ta chida la fisica</p>
        </div>
        </div>
        <div class="carousel-item" style="max-height: 600px;">
        <img src="../imagenes/futbolcampeon.jpeg" class="d-block w-100" alt="imagen de futbol">
        <div class="carousel-caption d-none d-md-block">
            <h5>Futbol</h5>
            <p>Solo Calusha</p>
        </div>
        </div>
        <div class="carousel-item" style="max-height: 600px;">
        <img src="../imagenes/valorant.jpeg" class="d-block w-100" alt="imagen de valorant">
        <div class="carousel-caption d-none d-md-block">
            <h5>Valorant</h5>
            <p>Soy el poderosisimo Tenz</p>
        </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
    </div>


<!--Seccion para colocar marcas y un grid de 6 columnas-->
<div class="container-fluid bg-warning">
    <div class="row">
        <div class="col-sm-6 col-md-4 col-lg-2"> 1 </div>
        <div class="col-sm-6 col-md-4 col-lg-2"> 2 </div>
        <div class="col-sm-6 col-md-4 col-lg-2"> 3 </div>
        <div class="col-sm-6 col-md-4 col-lg-2"> 4 </div>
        <div class="col-sm-6 col-md-4 col-lg-2"> 5 </div>
        <div class="col-sm-6 col-md-4 col-lg-2"> 6 </div>
    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
